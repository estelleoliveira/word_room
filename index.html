<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ma chambre à mots</title>
<style>
:root{--wall:#e8dcc8;--floor:#b98a5a;--ink:#2b2118;--paper:#fffaf0;--accent:#2f7d6d;--trim:#f4efe4;--rug:#c0614f;--muted:#6b5b4b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--wall:#2a2f35;--floor:#5a4430;--ink:#f1e9dc;--paper:#3a3f46;--accent:#6fcab8;--trim:#1d2025;--rug:#7a3b33;--muted:#b9ae9f}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{overflow:auto;font-family:Georgia,"Times New Roman",serif;background:var(--wall);color:var(--ink);display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px}
h1{font-size:1.2rem;margin:0}
.info{font-size:.85rem;color:var(--muted);font-family:system-ui,sans-serif;text-align:right}
#room{position:relative;width:calc(100% - 24px);max-width:480px;aspect-ratio:4/5;margin:0 auto;border-radius:12px;overflow:hidden;border:2px solid var(--muted)}
.bg{position:absolute;inset:0;width:100%;height:100%}
.obj{position:absolute;transform:translate(-50%,-100%);background:none;border:0;cursor:pointer;padding:0}
.st{position:absolute;left:50%;top:100%;transform:translateX(-50%);font-size:.6rem;color:#e0a800;white-space:nowrap;text-shadow:0 0 2px rgba(0,0,0,.5)}
.lvl{border-top:1px dashed var(--muted);margin-top:12px;padding-top:8px;text-align:left}
.lvl b{color:var(--accent);font-size:.85rem}
.stars{color:#e0a800;letter-spacing:2px}
.obj:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.empty{position:absolute;inset:0 0 auto 0;top:6%;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted)}
footer{padding:12px 16px}
#draw{width:100%;font:inherit;font-size:1.05rem;padding:14px;border-radius:10px;border:0;background:var(--accent);color:#fff;cursor:pointer}
#draw:disabled{opacity:.55;cursor:default}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;place-items:center;padding:20px}
#modal.on{display:grid}
.card{background:var(--paper);color:var(--ink);border-radius:14px;padding:24px;max-width:340px;width:100%;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.card .e{width:84px;margin:0 auto}
.card h2{margin:.2em 0 0;font-size:1.8rem}
.card .g{color:var(--muted);font-style:italic;margin:0 0 .8em}
.card p{margin:.5em 0;line-height:1.5}
.card .ex{color:var(--muted)}
.card button{margin-top:14px;font:inherit;padding:10px 20px;border-radius:8px;border:1px solid var(--muted);background:none;color:var(--ink);cursor:pointer}
</style>
</head>
<body>
<header>
  <h1>Ma chambre à mots</h1>
  <div class="info"><div id="count"></div><div id="timer"></div></div>
</header>
<main id="room"></main>
<footer><button id="draw">Récolter un mot</button></footer>
<div id="modal" role="dialog" aria-modal="true"><div class="card" id="card"></div></div>

<script>

const ICON={
"apple":'<path d="M32 20c-8-6-20 0-18 14s10 24 18 24 16-8 18-24-10-20-18-14z" fill="#d94a3d"/><path d="M32 20c0-6 2-10 6-12"/><path d="M38 10c6-2 10 2 10 2s-4 6-10 4z" fill="#5aa05a"/>',

"mirror":'<ellipse cx="32" cy="32" rx="19" ry="28" fill="#cfe9f3" stroke="#c9a14a" stroke-width="4"/><path d="M24 22l7-8" stroke="#fff" stroke-width="3"/>',
"door":'<rect x="14" y="2" width="36" height="60" rx="2" fill="#9a6a45"/><rect x="19" y="8" width="26" height="20"/><rect x="19" y="34" width="26" height="22"/><circle cx="43" cy="34" r="2.5" fill="#e0b73a"/>',

const PLACE={"window": [105, 205, 100], "cactus": [152, 208, 30], "moon": [88, 170, 24], "mirror": [228, 222, 64], "clock": [228, 128, 40], "candle": [192, 262, 26], "book": [220, 262, 28], "apple": [248, 262, 24], "key": [274, 262, 24], "feather": [298, 262, 26], "door": [352, 335, 100], "umbrella": [300, 360, 44], "butterfly": [312, 150, 38], "bed": [95, 428, 180], "teddy bear": [140, 348, 42], "crown": [58, 345, 32], "lamp": [200, 432, 72], "guitar": [258, 452, 70], "sofa": [325, 470, 135], "chair": [205, 478, 64], "plant": [30, 482, 56], "suitcase": [50, 498, 56], "shell": [105, 498, 28], "mushroom": [140, 498, 28], "compass": [172, 498, 30], "bread": [250, 498, 28], "drum": [392, 498, 40]};
const icon=n=>'<svg viewBox="0 0 64 64" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" style="stroke:#3a2e2a;display:block;width:100%">'+(ICON[n]||"")+'</svg>';
const SCENE='<svg class="bg" viewBox="0 0 400 500" preserveAspectRatio="none"><rect width="400" height="335" fill="var(--wall)"/><rect y="335" width="400" height="165" fill="var(--floor)"/><rect y="326" width="400" height="12" fill="var(--trim)"/><g stroke="var(--trim)" stroke-width="1" opacity=".5"><path d="M0 380h400M0 430h400M0 480h400M70 335l-30 165M200 335v165M330 335l30 165"/></g><ellipse cx="200" cy="445" rx="150" ry="30" fill="var(--rug)"/><ellipse cx="200" cy="445" rx="130" ry="23" fill="none" stroke="var(--wall)" stroke-width="2" opacity=".6"/><rect x="172" y="262" width="142" height="6" fill="var(--floor)"/><path d="M182 268v12M304 268v12" stroke="var(--floor)" stroke-width="4"/></svg>';
const KEY="mots_en_v1",H12=12*3600*1000,MAX=5;
let S={got:{},coins:0,left:MAX,start:0};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);

function refill(){if(S.left<MAX&&S.start&&Date.now()-S.start>=H12){S.left=MAX;S.start=0;save()}}
function fmt(ms){const m=Math.ceil(ms/60000);return Math.floor(m/60)+"h"+String(m%60).padStart(2,"0")}
function ui(){
  refill();
  $("count").textContent=S.left+" tirage"+(S.left>1?"s":"")+" · "+S.coins+" pièces";
  const d=$("draw");d.disabled=S.left===0;
  d.textContent=S.left?"Récolter un mot":"Plus de tirage";
  $("timer").textContent=S.left===0?"Prochains mots dans "+fmt(S.start+H12-Date.now()):"";
}
function render(){
  const room=$("room");room.innerHTML=SCENE;
  const ids=Object.keys(S.got);
  if(!ids.length)room.insertAdjacentHTML("beforeend",'<div class="empty">Ta chambre est vide.<br>Récolte un premier mot pour la meubler.</div>');
  ids.forEach(i=>{
    const w=WORDS[i],p=PLACE[w[0]]||[200,470,40],lv=S.got[i].lv||1;
    const b=document.createElement("button");
    b.className="obj";b.innerHTML=icon(w[0])+'<span class="st">'+"★".repeat(lv)+"</span>";
    b.style.cssText=`left:${p[0]/4}%;top:${p[1]/5}%;width:${p[2]/4}%;z-index:${p[1]}`;
    b.setAttribute("aria-label",w[0]);b.onclick=()=>show(i);
    room.appendChild(b);
  });
}
function show(i,note){
  const w=WORDS[i],lv=(S.got[i]&&S.got[i].lv)||1,x=EXTRA[w[0]]||[];
  let h=`<div class="e">${icon(w[0])}</div><h2>${w[0]}</h2><div class="stars">${"★".repeat(lv)}${"☆".repeat(3-lv)}</div><p class="g">${w[2]}</p><p>${w[3]}</p><p class="ex">« ${w[4]} »</p>`;
  if(lv>=2&&x[0])h+=`<div class="lvl"><b>Niveau 2</b><p class="ex">« ${x[0]} »</p></div>`;
  if(lv>=3&&x[1])h+=`<div class="lvl"><b>Niveau 3</b><p class="ex">${x[1]}</p></div>`;
  if(note)h+=`<p><strong>${note}</strong></p>`;
  $("card").innerHTML=h+`<button id="close">Fermer</button>`;
  $("modal").classList.add("on");$("close").focus();
  $("close").onclick=()=>$("modal").classList.remove("on");
}
$("modal").onclick=e=>{if(e.target.id==="modal")$("modal").classList.remove("on")};
$("draw").onclick=()=>{
  refill();if(S.left<1)return;
  if(S.left===MAX)S.start=Date.now();
  S.left--;
  const owned=Object.keys(S.got),free=WORDS.map((_,i)=>i).filter(i=>!(i in S.got));
  let i,note="";
  if(free.length&&!(owned.length&&Math.random()<.25)){
    i=free[Math.floor(Math.random()*free.length)];
    S.got[i]={lv:1};
    note="Nouveau mot !";
  }else{
    i=+owned[Math.floor(Math.random()*owned.length)];
    const g=S.got[i];g.lv=g.lv||1;
    if(g.lv<3){g.lv++;note="Ta carte évolue : niveau "+g.lv+" !"}
    else{S.coins++;note="Niveau max : +1 pièce"}
  }
  save();render();ui();show(i,note);
};
ui();render();setInterval(ui,30000);
</script>
</body>
</html>
